<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Lyra App</title>
</head>
<body>
    <div class="app-screen">
        <div class="phone-frame">
            <header class="app-header">
                <div>
                    <p class="greeting">Good morning</p>
                    <h1>Raff</h1>
                </div>
                <button class="icon-btn">🔔</button>
            </header>

            <section class="balance-card">
                <div class="balance-top">
                    <span>Balance</span>
                    <span class="chip">+8.2%</span>
                </div>
                <h2>$24,860.00</h2>
                <div class="balance-bars">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </section>

            <section class="quick-actions">
                <button>Send</button>
                <button>Top up</button>
                <button>Card</button>
            </section>

            <section class="section-header">
                <h3>Overview</h3>
                <a href="#">This week</a>
            </section>

            <section class="stats-row">
                <div class="mini-stat">
                    <small>Income</small>
                    <strong>$4.2k</strong>
                </div>
                <div class="mini-stat accent">
                    <small>Expenses</small>
                    <strong>$2.1k</strong>
                </div>
            </section>

            <section class="list-card">
                <div class="list-header">
                    <h3>Recent</h3>
                    <a href="#">View all</a>
                </div>

                <div class="transaction">
                    <div class="tx-left">
                        <div class="avatar purple">N</div>
                        <div>
                            <strong>Nike Store</strong>
                            <small>Shopping</small>
                        </div>
                    </div>
                    <span class="amount negative">-$128</span>
                </div>

                <div class="transaction">
                    <div class="tx-left">
                        <div class="avatar green">A</div>
                        <div>
                            <strong>Apple Pay</strong>
                            <small>Transfer</small>
                        </div>
                    </div>
                    <span class="amount positive">+$600</span>
                </div>

                <div class="transaction">
                    <div class="tx-left">
                        <div class="avatar blue">S</div>
                        <div>
                            <strong>Spotify</strong>
                            <small>Subscription</small>
                        </div>
                    </div>
                    <span class="amount negative">-$19</span>
                </div>
            </section>

            <nav class="bottom-nav">
                <button class="active">⌂</button>
                <button>◌</button>
                <button>＋</button>
                <button>☰</button>
            </nav>
        </div>
    </div>
</body>
</html>
